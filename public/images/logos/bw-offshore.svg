  <rect x="10" y="10" width="60" height="60" rx="6" fill="#003876"/>
  <text x="40" y="50" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" letter-spacing="1">BW</text>
  <!-- Company name -->
  <text x="150" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#666666" letter-spacing="2">BW</text>
  <text x="150" y="54" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#003876" letter-spacing="2">OFFSHORE</text>
  <!-- Wave accent -->
